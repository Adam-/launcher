name: CI

on: [ push, pull_request ]

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.m2/repository
        key: ${{ runner.os }}-cache-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-cache-
    - run: choco install innosetup
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: 11
        distribution: temurin
    - uses: ilammy/msvc-dev-cmd@v1 # for nmake
      with:
        arch: x64
    - name: build detours x64
      shell: cmd
      run: |
        cd detours/src
        nmake
    - uses: ilammy/msvc-dev-cmd@v1 # for nmake
      with:
        arch: x86
    - name: build detours x86
      shell: cmd
      run: |
        cd detours/src
        nmake
    - uses: ilammy/msvc-dev-cmd@v1 # for nmake
      with:
        arch: amd64_arm64
    - name: build detours aarch64
      shell: cmd
      run: |
        cd detours/src
        nmake
    - name: build dll x64
      shell: cmd
      run: |
        cmake -S native -B native/build64 -A x64
        cmake --build native/build64 --config Release
    - name: build dll x86
      shell: cmd
      run: |
        cmake -S native -B native/build32 -A Win32
        cmake --build native/build32 --config Release
    - name: build dll aarch64
      shell: cmd
      run: |
        cmake -S native -B native/buildaarch64 -A ARM64
        cmake --build native/buildaarch64 --config Release
    - name: build launcher
      run: mvn verify -B
#    - name: x64 installer
#      shell: bash
#      run: ./build-win64.sh
#    - name: x86 installer
#      shell: bash
#      run: ./build-win32.sh
    - name: AArch64 installer
      shell: bash
      run: ./build-win-aarch64.sh
    - uses: actions/upload-artifact@v3
      with:
        name: windows
        path: |
#          RuneLiteSetup.exe
#          RuneLiteSetup32.exe
          RuneLiteSetupAArch64.exe
        if-no-files-found: error